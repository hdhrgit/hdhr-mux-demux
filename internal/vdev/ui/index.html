<!doctype html>

<link rel="icon" href="/ui/favicon.svg" type="image/svg+xml">
<script>
// Pick the theme before the first paint so there is no flash of the wrong one.
(function () {
  var LIGHT = ['paper', 'mist', 'mint', 'lilac'], DARK = ['slate', 'midnight', 'dusk', 'ember'];
  var s = {};
  try { s = JSON.parse(localStorage.getItem('hdhrmux.theme') || '{}'); } catch (e) {}
  var mode = s.mode || 'system', light = s.light || 'paper', dark = s.dark || 'slate';
  var q = new URLSearchParams(location.search).get('theme');
  var t;
  if (q && (LIGHT.indexOf(q) >= 0 || DARK.indexOf(q) >= 0)) t = q;
  else if (mode === 'light') t = light;
  else if (mode === 'dark') t = dark;
  else t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? dark : light;
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="stylesheet" href="/ui/app.css">
</head>
