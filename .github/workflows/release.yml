name: release
# Push a tag like v0.99.0 to build and publish a release: tarballs, .deb and
# .rpm packages for amd64, arm64 and armv7, and a multi-architecture image on
# ghcr.io. (Tags with a dash, like v0.99.0-rc1, are published as pre-releases and
# do not move the "latest" image tag.)
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

      - name: version
        id: v
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF_NAME" in *-*) echo "pre=true" >> "$GITHUB_OUTPUT";; *) echo "pre=false" >> "$GITHUB_OUTPUT";; esac
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hdhr-mux" >> "$GITHUB_OUTPUT"

      - name: tarballs, deb and rpm
        run: scripts/release.sh "${{ steps.v.outputs.version }}"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image (amd64, arm64, armv7)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.pre == 'false' && format('{0}:latest', steps.v.outputs.image) || '' }}

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=docs/releases/${{ steps.v.outputs.version }}.md
          [ -f "$notes" ] || { echo "no $notes: using generated notes"; notes=""; }
          args=""
          [ "${{ steps.v.outputs.pre }}" = "true" ] && args="--prerelease"
          if [ -n "$notes" ]; then
            gh release create "${{ steps.v.outputs.tag }}" dist/* --title "${{ steps.v.outputs.tag }}" --notes-file "$notes" $args
          else
            gh release create "${{ steps.v.outputs.tag }}" dist/* --title "${{ steps.v.outputs.tag }}" --generate-notes $args
          fi
