# Built by scripts/release.sh with VERSION and ARCH (nfpm names: amd64, arm64, arm7)
name: hdhr-mux
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: hdhrgit <hdhrgit@rogocz.com>
description: |
  Virtual HDHomeRun that combines several physical HDHomeRun devices and shares
  one tuner between everybody watching the same channel. Speaks the HDHomeRun
  protocols, serves a web interface, M3U playlist, XMLTV guide and metrics.
homepage: https://github.com/hdhrgit/hdhr-mux-demux
license: unspecified
contents:
  - src: dist/bin/linux-${GOARCH}${GOARM}/hdhr-mux
    dst: /usr/bin/hdhr-mux
    file_info:
      mode: 0755
  - src: packaging/hdhr-mux.service
    dst: /lib/systemd/system/hdhr-mux.service
    file_info:
      mode: 0644
scripts:
  postinstall: packaging/postinstall.sh
  preremove: packaging/preremove.sh
